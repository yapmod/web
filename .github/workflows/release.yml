name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history and tags so changelogen can find the previous release.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Bump version, generate changelog, and tag
        if: github.event_name == 'workflow_dispatch'
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # changelogen bumps package.json and regenerates CHANGELOG.md from
          # conventional commits since the previous tag.
          pnpm exec changelogen --bump "--${BUMP}" --no-commit --no-tag

          # Keep both extension manifests in sync with package.json.
          pnpm version:sync

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          git add CHANGELOG.md package.json pnpm-lock.yaml \
            src/chrome/manifest.json src/firefox/manifest.json

          if git diff --cached --quiet; then
            echo "::error::No release changes detected. Add commits since the last tag before releasing."
            exit 1
          fi

          git commit -m "chore(release): v${NEW_VERSION}"

          # Refuse to silently move an existing tag; a release tag must point
          # at exactly one commit.
          if git rev-parse "refs/tags/v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${NEW_VERSION} already exists."
            exit 1
          fi

          git tag "v${NEW_VERSION}"
          git push origin HEAD:main
          git push origin "v${NEW_VERSION}"

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ steps.bump.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=v${DISPATCH_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test both built content scripts
        run: node --test

      - name: Package Chrome extension
        run: |
          set -euo pipefail
          cd dist/chrome
          zip -r "$GITHUB_WORKSPACE/chrome.zip" .

      - name: Package Firefox extension
        run: |
          set -euo pipefail
          cd dist/firefox
          zip -r "$GITHUB_WORKSPACE/firefox.zip" .

      - name: Prepare release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          # Use only the section for this release instead of the whole changelog.
          awk -v v="$VERSION" '
            $0 == "## v" v || $0 == "## [v" v "]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::warning::No changelog section found for ${TAG}; using the full changelog."
            cp CHANGELOG.md "$NOTES_FILE"
          fi

          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            chrome.zip
            firefox.zip
          body_path: ${{ steps.notes.outputs.file }}
