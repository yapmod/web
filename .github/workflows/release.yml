name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch/minor/major) or explicit version (e.g. 1.3.0)'
        required: false
        default: 'patch'
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Bump version and tag
        if: github.event_name == 'workflow_dispatch'
        id: bump
        run: |
          # Read current version from Chrome manifest
          CURRENT=$(jq -r '.version' src/chrome/manifest.json)
          BUMP_INPUT="${{ github.event.inputs.bump }}"

          # Check if input is an explicit version (contains dots)
          if echo "$BUMP_INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            NEW_VERSION="$BUMP_INPUT"
          else
            # Bump the version using semver logic
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP_INPUT" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch|*)
                PATCH=$((PATCH + 1))
                ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          # Update both manifest files
          jq --arg v "$NEW_VERSION" '.version = $v' src/chrome/manifest.json > tmp.json && mv tmp.json src/chrome/manifest.json
          jq --arg v "$NEW_VERSION" '.version = $v' src/firefox/manifest.json > tmp.json && mv tmp.json src/firefox/manifest.json

          # Configure git and commit only if version actually changed
          if [ "$CURRENT" != "$NEW_VERSION" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add src/chrome/manifest.json src/firefox/manifest.json
            git commit -m "chore: bump version to ${NEW_VERSION}"
            git push origin main
          fi
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build

      - name: Package Chrome extension
        run: zip -r chrome.zip dist/chrome/

      - name: Package Firefox extension
        run: zip -r firefox.zip dist/firefox/

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # github.ref_name is like "v1.2.5" for tag pushes
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: chrome.zip,firefox.zip
          generate_release_notes: true
