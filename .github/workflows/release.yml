name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch/minor/major)'
        required: false
        default: 'patch'
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Bump version, generate changelog, and tag
        if: github.event_name == 'workflow_dispatch'
        id: bump
        run: |
          BUMP_INPUT="${{ github.event.inputs.bump }}"

          # Run changelogen to bump version and update CHANGELOG.md
          pnpm release --$BUMP_INPUT

          # Sync version to manifest files
          pnpm version:sync

          NEW_VERSION=$(node -p "require('./package.json').version")

          # Configure git
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Commit changelog and version changes
          git add CHANGELOG.md package.json pnpm-lock.yaml src/chrome/manifest.json src/firefox/manifest.json
          git commit -m "chore(release): v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main
          git push origin "v${NEW_VERSION}"

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build

      - name: Package Chrome extension
        run: zip -r chrome.zip dist/chrome/

      - name: Package Firefox extension
        run: zip -r firefox.zip dist/firefox/

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # github.ref_name is like "v1.2.5" for tag pushes
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: chrome.zip,firefox.zip
          body_path: CHANGELOG.md
